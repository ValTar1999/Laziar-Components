# CI for gitlab.agora.md/laziar/frontend-components
# Shared runners inject `docker volume prune` in pre_build_script, so the job
# image must include the docker CLI (same pattern as laziar/frontend).

image: docker:27-cli

stages:
  - test
  - build

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.node_job:
  interruptible: true
  before_script:
    - apk add --no-cache nodejs npm git
    - node --version
    - npm --version

lint:
  extends: .node_job
  stage: test
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run lint

test:
  extends: .node_job
  stage: test
  before_script:
    - apk add --no-cache nodejs npm git chromium nss freetype harfbuzz ca-certificates ttf-freefont
    - export CHROME_BIN=$(command -v chromium-browser || command -v chromium)
    - echo "CHROME_BIN=$CHROME_BIN"; "$CHROME_BIN" --version
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run test:ci

build:
  extends: .node_job
  stage: build
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run build:lib
    - npm run build:docs
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - dist/
