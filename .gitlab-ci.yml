# Same runner setup as laziar/frontend on gitlab.agora.md:
# - image must include docker CLI (pre_build_script runs `docker volume prune`)
# - install Node via apk
# - runner is tagged `shared`

image: docker:27-cli

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

stages:
  - verify

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.job:
  tags:
    - shared
  interruptible: true
  before_script:
    - apk add --no-cache nodejs npm git
    - node --version

lint:
  extends: .job
  stage: verify
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run lint

test:
  extends: .job
  stage: verify
  before_script:
    - apk add --no-cache nodejs npm git chromium nss freetype harfbuzz ca-certificates ttf-freefont
    - node --version
  script:
    - export CHROME_BIN=$(command -v chromium-browser || command -v chromium)
    - echo "CHROME_BIN=$CHROME_BIN"; "$CHROME_BIN" --version
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run test:ci

build:
  extends: .job
  stage: verify
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run build:lib
    - npm run build:docs
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - dist/
