# Same runner setup as laziar/frontend on gitlab.agora.md:
# - image must include docker CLI (pre_build_script runs `docker volume prune`)
# - install Node via apk
# - runner is tagged `shared`

image: docker:27-cli

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

stages:
  - verify
  - publish

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.job:
  tags:
    - shared
  interruptible: true
  before_script:
    - apk add --no-cache nodejs npm git
    - node --version

lint:
  extends: .job
  stage: verify
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run lint

test:
  extends: .job
  stage: verify
  before_script:
    - apk add --no-cache nodejs npm git chromium nss freetype harfbuzz ca-certificates ttf-freefont
    - node --version
  script:
    - export CHROME_BIN=$(command -v chromium-browser || command -v chromium)
    - echo "CHROME_BIN=$CHROME_BIN"; "$CHROME_BIN" --version
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run test:ci

build:
  extends: .job
  stage: verify
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run build:lib
    - npm run build:docs
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - dist/

publish:
  extends: .job
  stage: publish
  # A job that declares `needs` leaves the stage-ordering DAG, so with only build listed
  # publish did not wait on lint or test and would ship on a red verify stage. That is not
  # how 0.1.21 shipped: no check in this repo could have failed on the Logo removal - no
  # library code references what a consumer imports - so there was nothing for publish to
  # bypass. It matters from now on, because public-api.spec.ts makes that class of removal
  # fail the test job, and a failing test only prevents a bad publish if publish waits.
  needs:
    - job: build
      artifacts: true
    - job: lint
      artifacts: false
    - job: test
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - node scripts/publish-lib.mjs --skip-build
