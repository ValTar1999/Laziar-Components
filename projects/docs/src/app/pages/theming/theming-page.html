<article class="page">
  <p class="page__eyebrow">{{ 'theming.eyebrow' | transloco }}</p>
  <h1 class="page__title">{{ 'theming.title' | transloco }}</h1>
  <p class="page__lead" [innerHTML]="'theming.lead' | transloco"></p>

  <section class="page__section">
    <h2>{{ 'theming.connect' | transloco }}</h2>
    <pre
      class="page__code"
    ><code>&#64;import '&#64;laziar/components/styles/theme.css';</code></pre>
  </section>

  <section class="page__section">
    <h2>{{ 'theming.palette' | transloco }}</h2>
    <div class="swatches">
      <div class="swatch" style="background: var(--lz-color-primary)">primary</div>
      <div class="swatch" style="background: var(--lz-color-secondary)">secondary</div>
      <div class="swatch" style="background: var(--lz-color-success)">success</div>
      <div
        class="swatch"
        style="background: var(--lz-color-warning); color: var(--lz-color-text-primary)"
      >
        warning
      </div>
      <div class="swatch" style="background: var(--lz-color-danger)">danger</div>
      <div class="swatch" style="background: var(--lz-color-neutral)">neutral</div>
    </div>
    <p class="page__note" [innerHTML]="'theming.note' | transloco"></p>
  </section>
</article>
