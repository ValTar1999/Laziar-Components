<docs-component-page [meta]="meta">
  <ng-template docsPreview let-values>
    <lz-expand
      [title]="str(values, 'title', 'Read more')"
      [content]="
        str(values, 'content', '<p>The full story continues here, in the same article type.</p>')
      "
    />
  </ng-template>
</docs-component-page>
