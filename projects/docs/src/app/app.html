<div
  class="shell"
  [class.shell--nav-open]="mobileNavOpen()"
  [class.shell--desktop]="isDesktop()"
  [style.--docs-header-height]="headerHeight() > 0 ? headerHeight() + 'px' : null"
>
  @if (mobileNavOpen() && !isDesktop()) {
    <button
      type="button"
      class="shell__backdrop"
      [attr.aria-label]="'nav.closeMenu' | transloco"
      (click)="closeMobileNav()"
    ></button>
  }

  <aside class="shell__sidebar" [class.shell__sidebar--open]="mobileNavOpen()">
    <docs-sidebar
      [groups]="navGroups()"
      [collapsed]="navCollapsed()"
      (collapsedChange)="navCollapsed.set($event)"
      (closeMobile)="closeMobileNav()"
    />
  </aside>

  <div class="shell__main">
    <docs-header
      #headerHost
      class="shell__header"
      [mobileNavOpen]="mobileNavOpen()"
      (menuToggle)="toggleMobileNav()"
      (searchChange)="onSearch($event)"
    />

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>

<lz-toast-container />
