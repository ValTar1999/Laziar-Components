<header class="header">
  <div class="header__top">
    <div class="header__top-left">
      <div class="header__menu">
        <lz-button
          variant="iconOnly"
          size="sm"
          color="gray"
          [icon]="menuIcon()"
          iconVariant="outline"
          [ariaLabel]="menuLabelKey() | transloco"
          (buttonClick)="menuToggle.emit()"
        />
      </div>

      <a class="header__brand" routerLink="/getting-started" [title]="'nav.brand' | transloco">
        <span class="header__brand-text">{{ 'nav.brand' | transloco }}</span>
      </a>
    </div>

    <div class="header__repo header__repo--icon">
      <lz-button
        variant="iconOnly"
        size="sm"
        color="gray"
        icon="arrow-top-right-on-square"
        iconVariant="outline"
        [ariaLabel]="'header.repo' | transloco"
        (buttonClick)="openRepo()"
      />
    </div>
  </div>

  <div class="header__leading">
    <div class="header__search">
      <lz-input
        type="search"
        size="sm"
        pill
        appearance="laziarPanel"
        [placeholder]="'header.searchPlaceholder' | transloco"
        [ngModel]="search"
        (ngModelChange)="onSearch($event)"
      />
    </div>
  </div>

  <div class="header__actions">
    <docs-language-switcher />

    <lz-button-group class="header__theme" [attr.aria-label]="'header.themeAria' | transloco">
      <lz-button
        [label]="'header.themeLight' | transloco"
        size="sm"
        pill
        color="gray"
        [variant]="themeVariant('light')"
        (buttonClick)="setTheme('light')"
      />
      <lz-button
        [label]="'header.themeDark' | transloco"
        size="sm"
        pill
        color="gray"
        [variant]="themeVariant('dark')"
        (buttonClick)="setTheme('dark')"
      />
      <lz-button
        [label]="'header.themeAuto' | transloco"
        size="sm"
        pill
        color="gray"
        [variant]="themeVariant('auto')"
        (buttonClick)="setTheme('auto')"
      />
    </lz-button-group>

    <div class="header__repo header__repo--full">
      <lz-button
        [label]="'header.repo' | transloco"
        size="sm"
        variant="outline"
        color="gray"
        pill
        icon="arrow-top-right-on-square"
        iconVariant="outline"
        iconPosition="right"
        (buttonClick)="openRepo()"
      />
    </div>
  </div>
</header>
