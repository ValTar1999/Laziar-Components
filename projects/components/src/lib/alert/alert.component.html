<div
  [class]="alertClass()"
  [attr.data-variant]="variant()"
  [attr.data-size]="size()"
  [attr.data-padding]="padding()"
>
  <div class="lz-alert__content">
    <lz-icon [name]="iconName()" [type]="iconVariant()" class="lz-alert__icon" />

    <div class="lz-alert__body">
      <div class="lz-alert__text-content">
        <div class="lz-alert__title">
          {{ title() }}
        </div>
        <div class="lz-alert__text" *ngIf="text()">
          {{ text() }}
        </div>
      </div>

      <ng-content></ng-content>
    </div>
  </div>

  <lz-button
    *ngIf="showCloseButton()"
    [variant]="resolvedCloseVariant()"
    [color]="resolvedCloseColor()"
    size="xs"
    [pill]="true"
    icon="x-mark"
    class="lz-alert__close-button"
    (clicked)="onCloseClick()"
    ariaLabel="Close alert"
  >
  </lz-button>
</div>
