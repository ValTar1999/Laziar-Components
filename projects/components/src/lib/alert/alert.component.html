<div
  [class]="alertClass()"
  [attr.role]="role()"
  [attr.data-variant]="variant()"
  [attr.data-size]="size()"
  [attr.data-padding]="padding()"
>
  <div class="lz-alert__content">
    <lz-icon [name]="iconName()" [type]="iconVariant()" class="lz-alert__icon" aria-hidden="true" />

    <div class="lz-alert__body">
      <div class="lz-alert__text-content">
        <div class="lz-alert__title">
          {{ title() }}
        </div>
        @if (text()) {
          <div class="lz-alert__text">
            {{ text() }}
          </div>
        }
      </div>

      <ng-content></ng-content>
    </div>
  </div>

  @if (showCloseButton()) {
    <lz-button
      [variant]="resolvedCloseVariant()"
      [color]="resolvedCloseColor()"
      size="xs"
      [pill]="true"
      icon="x-mark"
      class="lz-alert__close-button"
      (clicked)="onCloseClick()"
      [ariaLabel]="closeLabel()"
    >
    </lz-button>
  }
</div>
