<div [ngClass]="containerClasses()">
  <button
    type="button"
    role="switch"
    [attr.aria-checked]="activeState()"
    [disabled]="effectiveDisabled()"
    [ngClass]="toggleClasses()"
    (click)="toggle()"
    (blur)="onTouched()"
  >
    <span [ngClass]="circleClasses()"></span>
  </button>
</div>
