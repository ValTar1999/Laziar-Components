<button
  class="lz-button"
  [class.lz-button--full]="fullWidth()"
  [class.lz-button--icon-end]="!isIconOnly() && resolvedIconPosition() === 'right' && !!icon()"
  [attr.type]="type()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-current]="ariaCurrentPage() ? 'page' : null"
  [attr.data-variant]="variant()"
  [attr.data-size]="size()"
  [attr.data-color]="color()"
  [attr.data-pill]="resolvedPill() ? 'true' : null"
  [attr.data-icon-only]="isIconOnly() ? 'true' : null"
  (click)="onClick()"
>
  @if (icon()) {
    <span [class]="iconWrapperClass()" aria-hidden="true">
      <ng-content select="[lzButtonIcon]" />
      <span class="lz-button__icon-fallback">
        <lz-icon [name]="icon()!" [type]="iconVariant() ?? 'outline'" />
      </span>
    </span>
  }

  @if (!isIconOnly() && label()) {
    <span class="lz-button__label">{{ label() }}</span>
  }

  <span class="lz-button__projected">
    <ng-content />
  </span>
</button>
