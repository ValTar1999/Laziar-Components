<button
  class="lz-button"
  [class.lz-button--icon-end]="!isIconOnly() && resolvedIconPosition() === 'right'"
  [attr.type]="type()"
  [disabled]="disabled()"
  [attr.aria-label]="effectiveAriaLabel()"
  [attr.aria-current]="ariaCurrentPage() ? 'page' : null"
  [attr.aria-disabled]="disabled() ? 'true' : null"
  [attr.data-variant]="variant()"
  [attr.data-size]="size()"
  [attr.data-color]="color()"
  [attr.data-pill]="resolvedPill() ? 'true' : null"
  [attr.data-icon-only]="isIconOnly() ? 'true' : null"
  [attr.data-icon-variant]="iconVariant() ?? null"
  (click)="onClick($event)"
>
  <span
    class="lz-button__icon"
    [class]="iconClass() ?? ''"
    [hidden]="!showIcon()"
    aria-hidden="true"
  >
    <ng-content select="[lzButtonIcon]" />
    <span class="lz-button__icon-fallback" [attr.data-icon]="icon() ?? 'icon'"></span>
  </span>

  @if (showLabel()) {
    <span class="lz-button__label">{{ label() }}</span>
  }

  <span class="lz-button__content">
    <ng-content />
  </span>
</button>
