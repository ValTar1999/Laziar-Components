<div class="lz-avatar" [attr.data-size]="size()">
  <div [class]="avatarContainerClass()">
    <ng-container *ngIf="hasImage(); else defaultContent">
      <img [src]="imgUrl()" [alt]="imageAlt()" class="lz-avatar__image" />
    </ng-container>

    <ng-template #defaultContent>
      <ng-container *ngIf="showPlaceholder(); else initialsContent">
        <!-- Figma: heroicons-outline2/user-circle -->
        <svg class="lz-avatar__placeholder" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M12 3.75C7.44365 3.75 3.75 7.44365 3.75 12C3.75 14.1739 4.59004 16.1508 5.96491 17.625C7.4701 16.0109 9.6171 15 12 15C14.3829 15 16.5299 16.0109 18.0351 17.625C19.41 16.1508 20.25 14.1739 20.25 12C20.25 7.44365 16.5563 3.75 12 3.75ZM16.9169 18.6254C15.685 17.316 13.9379 16.5 12 16.5C10.0621 16.5 8.31496 17.316 7.08307 18.6254C8.45636 19.6464 10.157 20.25 12 20.25C13.843 20.25 15.5436 19.6464 16.9169 18.6254ZM2.25 12C2.25 6.61522 6.61522 2.25 12 2.25C17.3848 2.25 21.75 6.61522 21.75 12C21.75 14.8973 20.4853 17.5003 18.4802 19.285C16.7581 20.8178 14.487 21.75 12 21.75C9.51298 21.75 7.24187 20.8178 5.51981 19.285C3.51473 17.5003 2.25 14.8973 2.25 12ZM12 7.5C10.7574 7.5 9.75 8.50736 9.75 9.75C9.75 10.9926 10.7574 12 12 12C13.2426 12 14.25 10.9926 14.25 9.75C14.25 8.50736 13.2426 7.5 12 7.5ZM8.25 9.75C8.25 7.67893 9.92893 6 12 6C14.0711 6 15.75 7.67893 15.75 9.75C15.75 11.8211 14.0711 13.5 12 13.5C9.92893 13.5 8.25 11.8211 8.25 9.75Z"
          />
        </svg>
      </ng-container>

      <ng-template #initialsContent>
        <span [class]="initialsClass()">{{ initials() }}</span>
      </ng-template>
    </ng-template>
  </div>

  <div *ngIf="topNotification()" [class]="topNotificationClass()" [attr.data-size]="size()">
    <ng-container
      *ngTemplateOutlet="statusCheck; context: { $implicit: topNotificationStatus() }"
    />
  </div>

  <div *ngIf="bottomNotification()" [class]="bottomNotificationClass()" [attr.data-size]="size()">
    <ng-container
      *ngTemplateOutlet="statusCheck; context: { $implicit: bottomNotificationStatus() }"
    />
  </div>

  <img
    *ngIf="imgNotification()"
    [class]="imgNotificationClass()"
    [src]="imgNotification()"
    alt=""
    [attr.data-size]="size()"
  />
</div>

<!-- Figma: _Base Avatar Status — heroicons-micro/check on success -->
<ng-template #statusCheck let-status>
  <svg
    *ngIf="status === 'success'"
    class="lz-avatar__notification-check"
    viewBox="0 0 12 12"
    fill="none"
    aria-hidden="true"
  >
    <path
      fill="currentColor"
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M9.31203 2.53197C9.57051 2.7043 9.64036 3.05353 9.46804 3.31202L5.71804 8.93702C5.62456 9.07724 5.47314 9.16816 5.30544 9.18476C5.13774 9.20137 4.97142 9.14191 4.85226 9.02275L2.60226 6.77275C2.38259 6.55308 2.38259 6.19692 2.60226 5.97725C2.82193 5.75758 3.17809 5.75758 3.39776 5.97725L5.16258 7.74208L8.53198 2.68798C8.70431 2.4295 9.05354 2.35965 9.31203 2.53197Z"
    />
  </svg>
</ng-template>
