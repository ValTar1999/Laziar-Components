<div class="lz-dropdown" [class.lz-dropdown--disabled]="disabled()">
  <button
    #trigger
    type="button"
    class="lz-dropdown__trigger"
    [id]="dropdownId"
    [disabled]="disabled()"
    [attr.data-size]="sizeVariant()"
    [attr.data-disabled]="disabled()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="menuId"
    aria-haspopup="menu"
    (click)="toggleDropdown()"
  >
    <span class="lz-dropdown__title">{{ title() }}</span>
    <lz-icon
      name="chevron-down"
      type="mini"
      class="lz-dropdown__chevron"
      [attr.data-open]="isOpen()"
    />
  </button>
</div>

<ng-template #menuTpl>
  <div class="lz-dropdown__menu" role="menu" [id]="menuId">
    @for (section of sections(); track $index) {
      <section class="lz-dropdown__section">
        @if (section.heading) {
          <p class="lz-dropdown__heading">{{ section.heading }}</p>
        }
        @for (item of section.items; track item) {
          <button
            type="button"
            class="lz-dropdown__item"
            role="menuitem"
            (click)="selectItem(item)"
            (keydown)="onItemKeydown($event, item)"
          >
            {{ item }}
          </button>
        }
      </section>
    }
  </div>
</ng-template>
