@if (rendered()) {
  <!-- Presentational: dismissal here is a mouse affordance whose keyboard
       equivalent is Escape, handled on the component host. -->
  <div
    class="lz-modal-backdrop"
    role="presentation"
    [class.lz-modal-backdrop--sheet]="sheetOnMobile()"
    [class.lz-modal-backdrop--leaving]="leaving()"
    (mousedown)="onBackdropPointerDown($event)"
  >
    <div
      [class]="'lz-modal lz-modal--' + size() + ' lz-modal--' + variant()"
      [class.lz-modal--dividers]="showDividers()"
      [class.lz-modal--leaving]="leaving()"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? labelId : null"
      [attr.aria-label]="!title() ? (ariaLabel() ?? null) : null"
      [attr.aria-describedby]="description() ? descriptionId : null"
      [attr.aria-busy]="busy() || null"
      [cdkTrapFocus]="!leaving()"
      [cdkTrapFocusAutoCapture]="true"
      tabindex="-1"
      (animationend)="onPanelAnimationEnd($event)"
    >
      <header class="lz-modal__header">
        <ng-content select="[lz-modal-header]">
          @if (title() && !isConfirm()) {
            <h2 class="lz-modal__title" [id]="labelId">{{ title() }}</h2>
          }
        </ng-content>

        @if (dismissible()) {
          <button
            type="button"
            class="lz-modal__close"
            [attr.aria-label]="closeButtonLabel()"
            [disabled]="busy()"
            (click)="requestClose('close-button')"
          >
            <!-- No iconClass: utility classes would have to be generated by the
                 consuming app's CSS framework, which never scans library
                 templates. Size comes from --lz-icon-size in our own styles. -->
            <lz-icon name="x-mark" type="outline" />
          </button>
        }
      </header>

      <div class="lz-modal__body">
        @if (isConfirm() && icon()) {
          <span class="lz-modal__icon" [attr.data-tone]="tone()" aria-hidden="true">
            <lz-icon [name]="icon()!" type="solid" />
          </span>
        }

        @if ((isConfirm() && title()) || description()) {
          <div class="lz-modal__intro">
            @if (isConfirm() && title()) {
              <h2 class="lz-modal__title" [id]="labelId">{{ title() }}</h2>
            }
            @if (description()) {
              <p class="lz-modal__description" [id]="descriptionId">{{ description() }}</p>
            }
          </div>
        }

        <ng-content select="[lz-modal-body]" />
        <ng-content />
      </div>

      <footer class="lz-modal__footer">
        <div class="lz-modal__footer-start">
          <ng-content select="[lz-modal-footer-start]" />
        </div>
        <div class="lz-modal__footer-end">
          <ng-content select="[lz-modal-footer]" />
        </div>
      </footer>
    </div>
  </div>
}
