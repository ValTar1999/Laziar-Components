<div
  class="lz-textarea-container"
  [class.lz-textarea-container--disabled]="effectiveDisabled()"
>
  @if (label()) {
    <label class="lz-textarea-label" [attr.for]="textareaId">{{ label() }}</label>
  }

  <textarea
    class="lz-textarea-field"
    [id]="textareaId"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [disabled]="effectiveDisabled()"
    [value]="value()"
    [attr.data-error]="error()"
    [attr.data-resize]="resize()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  ></textarea>

  @if (helperText()) {
    <span class="lz-textarea-helper" [attr.data-error]="error()">
      @if (error()) {
        <lz-icon name="exclamation-circle" type="mini" class="lz-textarea-helper-icon" />
      }
      <span class="lz-textarea-helper-text">{{ helperText() }}</span>
    </span>
  }
</div>
