<div
  class="lz-message-chat"
  [attr.data-theme]="theme()"
  [attr.data-shape]="getRoundedStyle()"
  [attr.data-only-text]="hasOnlyText() ? 'true' : null"
  [attr.data-ready]="isReady ? 'true' : null"
>
  <ng-content />
  <div class="lz-message-chat__content">
    <div #textElement class="lz-message-chat__text" [innerHTML]="processTextWithLinks()"></div>
    <div class="lz-message-chat__time">{{ time() }}</div>
  </div>
</div>
