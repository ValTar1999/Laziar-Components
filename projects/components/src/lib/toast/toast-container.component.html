<div class="lz-toast-container" aria-live="polite" aria-atomic="false">
  @for (toast of toasts(); track toast.id) {
    <!-- An error interrupts the screen reader; the rest wait for a pause. -->
    <div
      class="lz-toast-container__item"
      [attr.role]="toast.type === 'error' ? 'alert' : null"
      (mouseenter)="pause(toast.id)"
      (mouseleave)="resume(toast.id)"
      (focusin)="pause(toast.id)"
      (focusout)="resume(toast.id)"
    >
      <lz-toast-notification
        [message]="toast.message"
        [messageBold]="toast.messageBold"
        [type]="toast.type"
        [closeLabel]="closeLabel()"
        (closed)="dismiss(toast.id)"
      ></lz-toast-notification>
    </div>
  }
</div>
