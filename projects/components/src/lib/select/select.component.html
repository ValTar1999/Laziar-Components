<div class="lz-select-container">
  @if (label()) {
    <label class="lz-select-label" [attr.for]="selectId">
      {{ label() }}
    </label>
  }

  <div class="lz-select-wrapper">
    <button
      type="button"
      class="lz-select-trigger"
      [id]="selectId"
      [disabled]="effectiveDisabled()"
      [attr.data-size]="size()"
      [attr.data-selected]="!!selected()"
      [attr.data-disabled]="effectiveDisabled()"
      [attr.aria-expanded]="isOpen()"
      aria-haspopup="listbox"
      (click)="toggleDropdown()"
    >
      <span class="lz-select-value">
        {{ displayValue() || placeholder() }}
      </span>
    </button>

    <lz-icon name="chevron-up-down" iconClass="lz-select-chevron" />
  </div>

  @if (helperText()) {
    <div class="lz-select-helper">
      {{ helperText() }}
    </div>
  }

  @if (isOpen()) {
    <ul class="lz-select-dropdown" role="listbox">
      @for (option of options(); track option) {
        <li
          class="lz-select-option"
          role="option"
          tabindex="0"
          [attr.aria-selected]="isSelected(option)"
          [attr.data-selected]="isSelected(option)"
          [attr.data-has-date]="!!formatOptionDate(option)"
          (click)="selectOption(option)"
          (keydown)="onOptionKeydown($event, option)"
        >
          <div class="lz-select-option-content" [attr.data-has-date]="!!formatOptionDate(option)">
            <div class="lz-select-option-text">
              <span class="lz-select-option-title" [attr.data-selected]="isSelected(option)">
                {{ getOptionTitle(option) }}
              </span>
              @if (formatOptionDate(option)) {
                <span class="lz-select-option-date">
                  Create pe data de - {{ formatOptionDate(option) }}
                </span>
              }
            </div>
            @if (isSelected(option)) {
              <svg
                class="lz-select-check-icon"
                [attr.data-has-date]="!!formatOptionDate(option)"
                width="12"
                height="12"
                viewBox="0 0 12 12"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  class="lz-select-check-path"
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M5.99995 10.8002C8.65092 10.8002 10.8 8.65116 10.8 6.0002C10.8 3.34923 8.65092 1.2002 5.99995 1.2002C3.34898 1.2002 1.19995 3.34923 1.19995 6.0002C1.19995 8.65116 3.34898 10.8002 5.99995 10.8002ZM8.31388 4.91487C8.46006 4.71388 8.41562 4.43244 8.21463 4.28626C8.01364 4.14009 7.7322 4.18452 7.58602 4.38552L5.49577 7.25962L4.36815 6.132C4.19241 5.95626 3.90749 5.95626 3.73175 6.132C3.55602 6.30773 3.55602 6.59266 3.73175 6.76839L5.23175 8.26839C5.32481 8.36145 5.45395 8.40911 5.58515 8.39882C5.71635 8.38852 5.83648 8.32131 5.91388 8.21487L8.31388 4.91487Z"
                />
              </svg>
            }
          </div>
        </li>
      }
    </ul>
  }
</div>
