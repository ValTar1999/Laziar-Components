<div
  class="lz-select-container"
  [class.lz-select-container--disabled]="effectiveDisabled()"
>
  @if (label()) {
    <label class="lz-select-label" [attr.for]="selectId">
      {{ label() }}
    </label>
  }

  <div class="lz-select-wrapper">
    <button
      #trigger
      type="button"
      class="lz-select-trigger"
      [id]="selectId"
      [disabled]="effectiveDisabled()"
      [attr.data-size]="size()"
      [attr.data-selected]="!!selected()"
      [attr.data-disabled]="effectiveDisabled()"
      [attr.data-error]="error()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="listboxId"
      [attr.aria-invalid]="error() ? true : null"
      aria-haspopup="listbox"
      (click)="toggleDropdown()"
    >
      <span class="lz-select-value">
        {{ displayValue() || placeholder() }}
      </span>
    </button>

    <lz-icon name="chevron-up-down" type="mini" class="lz-select-chevron" />
  </div>

  @if (helperText()) {
    <span class="lz-select-helper" [attr.data-error]="error()">
      @if (error()) {
        <lz-icon name="exclamation-circle" type="mini" class="lz-select-helper-icon" />
      }
      <span class="lz-select-helper-text">{{ helperText() }}</span>
    </span>
  }
</div>

<ng-template #dropdownTpl>
  <div class="lz-select-dropdown">
    <ul class="lz-select-dropdown-list" role="listbox" [id]="listboxId">
      @for (option of options(); track option) {
        <li
          class="lz-select-option"
          role="option"
          tabindex="0"
          [attr.aria-selected]="isSelected(option)"
          [attr.data-selected]="isSelected(option)"
          [attr.data-has-date]="!!formatOptionDate(option)"
          (click)="selectOption(option)"
          (keydown)="onOptionKeydown($event, option)"
        >
          <div class="lz-select-option-content" [attr.data-has-date]="!!formatOptionDate(option)">
            <div class="lz-select-option-text">
              <span class="lz-select-option-title" [attr.data-selected]="isSelected(option)">
                {{ getOptionTitle(option) }}
              </span>
              @if (formatOptionDate(option)) {
                <span class="lz-select-option-date">
                  Create pe data de - {{ formatOptionDate(option) }}
                </span>
              }
            </div>
            @if (isSelected(option)) {
              <span class="lz-select-check-badge" aria-hidden="true">
                <lz-icon name="check" type="mini" class="lz-select-check-icon" />
              </span>
            }
          </div>
        </li>
      }
    </ul>
  </div>
</ng-template>
