<div class="lz-language-dropdown">
  <div class="lz-language-dropdown__wrapper">
    <button
      #trigger
      type="button"
      class="lz-language-dropdown__trigger"
      [id]="dropdownId"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="menuId"
      aria-haspopup="listbox"
      (click)="toggleDropdown($event)"
    >
      @if (selectedLanguage(); as lang) {
        @if (lang.flag) {
          <img
            class="lz-language-dropdown__flag lz-language-dropdown__flag--sm"
            [src]="lang.flag"
            alt=""
          />
        }
        <span class="lz-language-dropdown__value">{{ getInitials(lang) }}</span>
      }
    </button>
    <lz-icon name="chevron-up-down" type="mini" class="lz-language-dropdown__chevron" />
  </div>
</div>

<ng-template #menuTpl>
  <div class="lz-language-dropdown__menu">
    <ul class="lz-language-dropdown__list" role="listbox" [id]="menuId">
      @for (lang of languages(); track lang.code) {
        <li
          class="lz-language-dropdown__item"
          role="option"
          tabindex="0"
          [attr.aria-selected]="isCurrentLanguage(lang.code)"
          [attr.data-selected]="isCurrentLanguage(lang.code)"
          (click)="selectLanguage(lang)"
          (keydown)="onLanguageKeydown($event, lang)"
        >
          <div class="lz-language-dropdown__item-content">
            @if (lang.flag) {
              <img class="lz-language-dropdown__flag" [src]="lang.flag" [alt]="lang.name" />
            }
            <span
              class="lz-language-dropdown__name"
              [attr.data-selected]="isCurrentLanguage(lang.code)"
            >
              {{ lang.name }}
            </span>
            @if (isCurrentLanguage(lang.code)) {
              <span class="lz-language-dropdown__check-badge" aria-hidden="true">
                <lz-icon name="check" type="mini" class="lz-language-dropdown__check-icon" />
              </span>
            }
          </div>
        </li>
      }
    </ul>
  </div>
</ng-template>
