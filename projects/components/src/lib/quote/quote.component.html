      />
    </svg>

    <div class="lz-quote__body">
      <blockquote class="lz-quote__text" [innerHTML]="content()"></blockquote>

      @if (showFooter()) {
        <figcaption class="lz-quote__footer">
          @if (showAuthor()) {
            <div class="lz-quote__author">
              @if (author()?.avatarUrl) {
                <img class="lz-quote__avatar" [src]="author()?.avatarUrl" alt="" />
              }

              <div class="lz-quote__author-text">
                <span class="lz-quote__name">{{ author()?.fullName }}</span>
                <span class="lz-quote__position">{{ author()?.position }}</span>
              </div>
            </div>
          }

          @if (subtext()) {
            <p class="lz-quote__caption">{{ subtext() }}</p>
          }
        </figcaption>
      }
    </div>
  </div>
</figure>
