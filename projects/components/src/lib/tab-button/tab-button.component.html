<div
  class="lz-tab-button"
  [attr.data-active]="active() ? 'true' : 'false'"
  [attr.data-size]="size()"
  [attr.data-variant]="resolvedVariant()"
>
  @if (link()) {
    <a class="lz-tab-button__control" [routerLink]="link()">
      {{ label() }}
    </a>
  } @else {
    <button type="button" class="lz-tab-button__control">
      {{ label() }}
    </button>
  }

  @if (resolvedVariant() === 'line') {
    <span class="lz-tab-button__line" aria-hidden="true"></span>
  }
</div>
