@if (!isLoading()) {
  <article class="lz-card" [attr.data-variant]="variant()" [attr.data-size]="size()">
    @if (image() && size() !== 'xxs') {
      <a class="lz-card__image-link" [href]="link()" target="_blank" rel="noopener noreferrer">
        <img class="lz-card__image" [src]="image()" alt="Card image" />
      </a>
    }

    <div class="lz-card__content">
      <a class="lz-card__title-link" [href]="link()" target="_blank" rel="noopener noreferrer">
        @if (title()) {
          <h2 class="lz-card__title">{{ title() }}</h2>
        }
        @if (image() && size() === 'xxs') {
          <img class="lz-card__image lz-card__image--inline" [src]="image()" alt="Card image" />
        }
      </a>

      @if (subtitle()) {
        <p class="lz-card__subtitle">{{ subtitle() }}</p>
      }

      <div class="lz-card__metadata">
        <button
          type="button"
          class="lz-card__bookmark"
          [attr.aria-pressed]="isChecked()"
          aria-label="Toggle bookmark"
          (click)="toggleChecked()"
        >
          <svg class="lz-card__bookmark-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path
              [attr.data-checked]="isChecked()"
              d="M11.7289 2.21494C12.4626 2.30009 13 2.93267 13 3.67132V14L8 11.5L3 14V3.67132C3 2.93267 3.53739 2.30009 4.27112 2.21494C5.49437 2.07298 6.73866 2 8 2C9.26134 2 10.5056 2.07298 11.7289 2.21494Z"
            />
          </svg>
        </button>
        @if (date()) {
          <time class="lz-card__date">{{ date() }}</time>
        }
      </div>
    </div>
  </article>
} @else {
  <article
    class="lz-card lz-card--loading"
    [attr.data-variant]="variant()"
    [attr.data-size]="size()"
    aria-busy="true"
  >
    @if (image()) {
      <div class="lz-card__skeleton lz-card__skeleton--image"></div>
    }
    <div class="lz-card__skeleton-content">
      @if (title()) {
        <div class="lz-card__skeleton lz-card__skeleton--title"></div>
        <div class="lz-card__skeleton lz-card__skeleton--title-short"></div>
      }
      @if (subtitle()) {
        <div class="lz-card__skeleton lz-card__skeleton--text"></div>
        <div class="lz-card__skeleton lz-card__skeleton--text-short"></div>
        <div class="lz-card__skeleton lz-card__skeleton--text-short"></div>
      }
      @if (date()) {
        <div class="lz-card__skeleton lz-card__skeleton--date"></div>
      }
    </div>
  </article>
}
